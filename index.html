<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Chiến Binh - Turn Base Tactics</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --primary: #4a90e2;
            --secondary: #50e3c2;
            --danger: #ff4b4b;
            --warning: #f5a623;
            --dark: #2c3e50;
            --light: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); min-height: 100vh; overflow: hidden; color: var(--dark); }

        /* Screens */
        .screen { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        .screen.active { display: flex; }

        /* Modern UI Components */
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: var(--shadow); padding: 20px; }
        .btn { padding: 12px 24px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; }
        .btn-primary { background: linear-gradient(45deg, var(--primary), #6ab0ff); color: white; box-shadow: 0 4px 15px rgba(74, 144, 226, 0.4); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(74, 144, 226, 0.6); }
        .btn-danger { background: linear-gradient(45deg, var(--danger), #ff7676); color: white; }
        .btn:disabled { filter: grayscale(100%); cursor: not-allowed; opacity: 0.6; }

        /* Main Menu */
        #menu-screen h1 { font-size: 4rem; margin-bottom: 2rem; color: #fff; text-shadow: 2px 2px 10px rgba(0,0,0,0.2); text-align: center;}
        
        /* Ban/Pick Phase */
        .phase-header { font-size: 2rem; margin-bottom: 10px; text-align: center; font-weight: bold; }
        .timer { font-size: 3rem; color: var(--danger); font-weight: 900; margin-bottom: 20px; text-shadow: 1px 1px 5px rgba(255,75,75,0.3); }
        .hero-pool { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; max-width: 800px; margin-bottom: 20px; }
        .hero-card { width: 120px; height: 160px; background: white; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; border: 3px solid transparent; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .hero-card:hover { transform: scale(1.05); }
        .hero-card.selected-t1 { border-color: var(--primary); }
        .hero-card.selected-t2 { border-color: var(--danger); }
        .hero-card.banned { filter: grayscale(100%); opacity: 0.5; pointer-events: none; }
        .hero-card.banned::after { content: 'BANNED'; position: absolute; color: red; font-weight: bold; transform: rotate(-45deg); font-size: 1.2rem; }
        .hero-avatar { font-size: 3rem; margin-bottom: 10px; }
        .hero-name { font-size: 0.9rem; font-weight: bold; text-align: center; padding: 0 5px; }
        .hero-role { font-size: 0.7rem; color: #666; background: #eee; padding: 2px 5px; border-radius: 5px; margin-top: 5px; }

        /* Battle Screen */
        #battle-screen { justify-content: space-between; padding: 20px; }
        .battle-header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; }
        .team-title { font-size: 1.5rem; font-weight: bold; padding: 5px 15px; border-radius: 10px; color: white; }
        .tt-1 { background: var(--primary); }
        .tt-2 { background: var(--danger); }
        
        .arena { display: flex; width: 100%; flex: 1; gap: 20px; position: relative; perspective: 1000px; }
        .team-side { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); gap: 15px; padding: 20px; align-items: center; justify-items: center; }
        .team2-side { direction: rtl; }

        /* In-battle Hero Entity */
        .entity { width: 140px; height: 180px; background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; align-items: center; padding: 10px; position: relative; transition: 0.3s; }
        .entity.active-turn { box-shadow: 0 0 20px 5px var(--warning); transform: translateY(-10px); }
        .entity.dead { filter: grayscale(100%); opacity: 0.3; }
        .e-avatar { font-size: 3.5rem; margin-bottom: 5px; }
        .e-name { font-size: 0.8rem; font-weight: bold; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: ltr; }
        
        /* Bars */
        .bar-container { width: 100%; height: 8px; background: #ddd; border-radius: 4px; margin-top: 5px; overflow: hidden; }
        .hp-bar { height: 100%; background: #2ecc71; transition: width 0.3s; }
        .en-bar { height: 100%; background: #9b59b6; transition: width 0.3s; }
        .hp-text { font-size: 0.65rem; text-align: center; width: 100%; margin-top: 2px; direction: ltr;}
        
        .status-icons { display: flex; gap: 2px; margin-top: 5px; flex-wrap: wrap; justify-content: center; height: 20px; width: 100%; }
        .status-icon { width: 16px; height: 16px; border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .buff-icon { background: var(--primary); }
        .debuff-icon { background: var(--danger); }

        /* Controls */
        .controls { width: 100%; height: 150px; display: flex; gap: 20px; align-items: center; justify-content: center; }
        .skill-btn { width: 250px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 15px; border: none; cursor: pointer; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.2s; }
        .skill-btn:hover:not(:disabled) { background: #f8f9fa; transform: scale(1.05); }
        .skill-title { font-weight: bold; font-size: 1.1rem; color: var(--dark); }
        .skill-desc { font-size: 0.8rem; color: #666; margin-top: 5px; text-align: center; padding: 0 10px;}

        /* Combat Log */
        .combat-log { position: absolute; bottom: 160px; left: 50%; transform: translateX(-50%); width: 600px; height: 120px; background: rgba(0,0,0,0.7); border-radius: 10px; color: white; padding: 10px; overflow-y: auto; font-size: 0.85rem; z-index: 5; border: 1px solid rgba(255,255,255,0.2); }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }
        .log-t1 { color: #6ab0ff; font-weight: bold; }
        .log-t2 { color: #ff7676; font-weight: bold; }
        .log-dmg { color: #f5a623; }
        .log-heal { color: #50e3c2; }

        /* Floating Text & Animations */
        .floating-text { position: absolute; font-weight: bold; font-size: 1.5rem; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; pointer-events: none; animation: floatUp 1s forwards ease-out; z-index: 20; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.2); } }
        
        .popup-event { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 100; text-align: center; color: white; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: translate(-50%, -50%) scale(0); } 100% { transform: translate(-50%, -50%) scale(1); } }
        
        .attack-anim { animation: atkMove 0.3s alternate 2; }
        @keyframes atkMove { 100% { transform: scale(1.1) translateY(-20px); z-index: 10; } }
        .hurt-anim { animation: shake 0.3s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }
    </style>
</head>
<body>

    <!-- MAIN MENU -->
    <div id="menu-screen" class="screen active">
        <h1>SIÊU CHIẾN BINH</h1>
        <div class="glass-panel" style="text-align: center;">
            <p style="margin-bottom: 20px; font-size: 1.2rem;">Chế độ chiến thuật - Turn Base (2 Người chơi)</p>
            <button class="btn btn-primary" onclick="GameApp.startBanPhase()">Vào Trận Chiến</button>
        </div>
    </div>

    <!-- BAN/PICK SCREEN -->
    <div id="bp-screen" class="screen">
        <div class="glass-panel" style="width: 90%; max-width: 1000px; display: flex; flex-direction: column; align-items: center;">
            <div class="phase-header" id="bp-title">CẤM TƯỚNG - ĐỘI 1</div>
            <div class="timer" id="bp-timer">25</div>
            <div class="hero-pool" id="bp-pool"></div>
            <div style="display: flex; gap: 20px;">
                <button class="btn btn-danger" id="bp-action-btn" onclick="GameApp.confirmBPAction()">Xác Nhận Cấm</button>
                <button class="btn" id="bp-skip-btn" onclick="GameApp.skipBPPhase()">Bỏ Qua (Cả 2 đồng ý)</button>
            </div>
            <div style="margin-top: 20px; width: 100%; display: flex; justify-content: space-between;">
                <div><strong>Đội 1:</strong> <span id="t1-picks"></span></div>
                <div><strong>Đội 2:</strong> <span id="t2-picks"></span></div>
            </div>
        </div>
    </div>

    <!-- BATTLE SCREEN -->
    <div id="battle-screen" class="screen">
        <div class="battle-header glass-panel">
            <div class="team-title tt-1">ĐỘI 1</div>
            <div style="font-weight: bold; font-size: 1.2rem;" id="turn-indicator">Đang chuẩn bị...</div>
            <div class="team-title tt-2">ĐỘI 2</div>
        </div>
        
        <div class="arena" id="arena">
            <div class="team-side" id="team1-side"></div>
            <div class="team-side team2-side" id="team2-side"></div>
        </div>

        <div class="combat-log" id="combat-log"></div>

        <div class="controls glass-panel">
            <button class="skill-btn" id="btn-normal" onclick="BattleEngine.castNormal()">
                <div class="skill-title">Đánh Thường</div>
                <div class="skill-desc" id="desc-normal">Gây ST lên mục tiêu</div>
            </button>
            <button class="skill-btn" id="btn-active" onclick="BattleEngine.castActive()">
                <div class="skill-title">Kỹ Năng Chủ Động</div>
                <div class="skill-desc" id="desc-active">Cần EN để kích hoạt</div>
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // DATABASE & DEFINITIONS
        // ==========================================
        const HERO_DB = [
            { id: 'jiren', name: 'Jiren', avatar: '👽', role: 'ATK', 
              baseHp: 235549000, baseAtk: 18750000, baseDef: 3000, spd: 150, maxEn: 4.6,
              desc: 'Tấn công hàng sau, bạo kích mạnh mẽ, cuồng bạo khi thấp máu.' },
            { id: 'goku', name: 'Goku (Xeno)', avatar: '🐒', role: 'DEF', 
              baseHp: 290000000, baseAtk: 13500000, baseDef: 6550, spd: 145, maxEn: 3,
              desc: 'Bảo vệ đồng đội, né tránh cao, hồi phục siêu mạnh khi nguy hiểm.' },
            { id: 'cooler', name: 'Cooler (Gold)', avatar: '🤖', role: 'DEF', 
              baseHp: 285000000, baseAtk: 13830000, baseDef: 5780, spd: 145, maxEn: 4,
              desc: 'Choáng mục tiêu, xóa buff kẻ địch, miễn nhiễm giảm hồi máu.' },
            { id: 'broly', name: 'Broly (SP)', avatar: '🟢', role: 'ATK', 
              baseHp: 224500000, baseAtk: 20000000, baseDef: 4300, spd: 150, maxEn: 3,
              desc: 'Sát thương tăng tiến, cấm hồi sinh, lá chắn nội tại.' },
            { id: 'zamasu', name: 'Zamasu (Collapse)', avatar: '🗡️', role: 'SKL', 
              baseHp: 276688000, baseAtk: 14348000, baseDef: 4200, spd: 155, maxEn: 4.4,
              desc: 'Sát thương diện rộng, chảy máu, khống chế diện rộng, giảm sức mạnh.' }
        ];

        // ==========================================
        // CLASSES (CORE LOGIC)
        // ==========================================
        class Buff {
            constructor(name, type, duration, effectData) {
                this.name = name; // Tên hiển thị
                this.type = type; // 'buff' | 'debuff' | 'mark'
                this.duration = duration; // Số lượt
                this.effectData = effectData; // Object chứa data
            }
        }

        class Hero {
            constructor(dbData, team, index) {
                this.id = dbData.id;
                this.name = dbData.name;
                this.avatar = dbData.avatar;
                this.team = team;
                this.index = index;
                this.uid = `${team}-${index}-${this.id}`;
                
                // Base Stats
                this.maxHp = dbData.baseHp;
                this.hp = this.maxHp;
                this.atk = dbData.baseAtk;
                this.def = dbData.baseDef;
                this.spd = dbData.spd;
                this.en = 0;
                this.maxEn = dbData.maxEn;
                
                // Advanced Stats
                this.critRate = 0;
                this.critDmg = 1.5;
                this.armorPierce = 0;
                this.dmgReduction = 0;
                this.dodgeRate = 0;
                this.healBonus = 0;
                this.shieldBonus = 0;
                this.bonusDmg = 0; // % tăng ST
                
                this.buffs = [];
                this.shield = 0;
                this.isDead = false;
                
                // Flags & Memory
                this.damageTakenDuringSevereWound = 0;
                this.passiveDisabled = false;
                this.zamasuStunCooldown = 0;
                this.gokuHealed = false; // Trigger once per battle for 50% passive? Let's say once per battle to avoid loop
                this.brolyDmgStacks = 0;
                this.jirenCritStacks = 0;
                this.brolyEnTurnCount = 0;
                
                this.initGodSkills();
            }

            initGodSkills() {
                // Áp dụng kỹ năng Thần ngay từ đầu
                if(this.id === 'jiren') {
                    this.maxHp *= 1.15; this.atk *= 1.08; this.dmgReduction += 0.05;
                    this.hp = this.maxHp;
                    this.armorPierce += 0.45; // Passive 1
                    this.critRate += 0.23; // Passive 2
                }
                else if(this.id === 'goku') {
                    this.dodgeRate += 0.09; this.armorPierce += 0.06;
                }
                else if(this.id === 'cooler') {
                    this.atk *= 1.25; this.dodgeRate += 0.05;
                }
                else if(this.id === 'broly') {
                    this.maxHp *= 1.25; this.critRate += 0.08; this.hp = this.maxHp;
                    this.armorPierce += 0.30;
                    this.critRate += 1.0; // Passive 3: +100% crit rate base
                    this.critRate += 0.20; // Passive 2
                }
                else if(this.id === 'zamasu') {
                    this.atk *= 1.10; this.maxHp *= 1.08; this.hp = this.maxHp;
                    this.dodgeRate += 0.07;
                }
            }

            updateStatsDisplay() {
                if(!this.domElement) return;
                const hpBar = this.domElement.querySelector('.hp-bar');
                const enBar = this.domElement.querySelector('.en-bar');
                const hpText = this.domElement.querySelector('.hp-text');
                
                hpBar.style.width = `${Math.max(0, (this.hp / this.maxHp) * 100)}%`;
                enBar.style.width = `${Math.min(100, (this.en / this.maxEn) * 100)}%`;
                hpText.innerHTML = `${Math.floor(this.hp).toLocaleString()}<br>EN: ${this.en.toFixed(1)}/${this.maxEn}`;
                
                // Update icons
                const iconContainer = this.domElement.querySelector('.status-icons');
                iconContainer.innerHTML = '';
                if(this.shield > 0) iconContainer.innerHTML += `<div class="status-icon buff-icon" title="Shield">S</div>`;
                this.buffs.forEach(b => {
                    const c = b.type === 'buff' ? 'buff-icon' : 'debuff-icon';
                    const letter = b.name.charAt(0).toUpperCase();
                    iconContainer.innerHTML += `<div class="status-icon ${c}" title="${b.name}">${letter}</div>`;
                });
            }

            hasBuff(name) { return this.buffs.some(b => b.name === name); }
            hasDebuff() { return this.buffs.some(b => b.type === 'debuff'); }

            addBuff(buff) {
                if(this.isDead) return;
                // Broly immune > 80%
                if(this.id === 'broly' && this.hp > this.maxHp * 0.8 && buff.type === 'debuff') {
                    BattleEngine.log(`${this.name} miễn nhiễm hiệu ứng xấu nhờ Kỹ Năng Thần!`, this.team);
                    return;
                }
                this.buffs.push(buff);
                this.updateStatsDisplay();
            }

            removeBuff(name) {
                this.buffs = this.buffs.filter(b => b.name !== name);
                this.updateStatsDisplay();
            }

            clearBuffsByType(type) {
                this.buffs = this.buffs.filter(b => b.type !== type);
                this.updateStatsDisplay();
            }

            takeDamage(source, rawDamage, isSkill = false, allowDodge = true) {
                if(this.isDead) return 0;
                
                // Dodge check
                if(allowDodge && Math.random() < this.dodgeRate) {
                    BattleEngine.showFloatingText(this.domElement, "NÉ TRÁNH", "#ffffff");
                    BattleEngine.log(`${this.name} đã né đòn!`, this.team);
                    return 0;
                }

                // Jiren Beserk Calc for Source
                let finalDmgBonus = source.bonusDmg;
                if(source.id === 'jiren' && source.hp < source.maxHp * 0.3) {
                    let missingPct = (source.maxHp - source.hp) / source.maxHp * 100;
                    finalDmgBonus += (missingPct / 0.5) * 0.01; // 1% per 0.5% missing
                }

                // Armor Pierce
                let actualDef = this.def * Math.max(0, 1 - source.armorPierce);
                
                // Zamasu Terror passive
                if(this.hasBuff('Terror')) actualDef *= 0.7; // giảm 30%

                let damage = (rawDamage * (1 + finalDmgBonus)) - actualDef;
                if(damage < 1) damage = 1;

                // Crit Check
                let isCrit = Math.random() < source.critRate;
                if(isCrit) damage *= source.critDmg;

                // DMG Reduction
                let totalReduction = this.dmgReduction;
                if(this.id === 'cooler' && this.hasDebuff()) totalReduction += 0.2;
                if(this.hasBuff('Bảo vệ')) totalReduction += 0.15;
                if(BattleEngine.getAliveHeroes(this.team).some(h => h.id === 'zamasu')) totalReduction += 0.05; // Zamasu passive 3
                if(source.id === 'goku' && this.hasBuff('GokuDebuff')) damage *= 0.9; // Goku skill effect
                
                damage *= Math.max(0, 1 - totalReduction);

                // Goku Bảo Vệ split
                if(this.hasBuff('Bảo vệ')) {
                    let goku = BattleEngine.getAliveHeroes(this.team).find(h => h.id === 'goku');
                    if(goku && !goku.isDead) {
                        let split = damage * 0.25;
                        damage -= split;
                        goku.receiveDirectDamage(split, source);
                        BattleEngine.log(`Goku chịu hộ ${Math.floor(split).toLocaleString()} ST cho ${this.name}`, this.team);
                    }
                }

                this.receiveDirectDamage(damage, source, isCrit);
                return damage;
            }

            receiveDirectDamage(damage, source, isCrit = false) {
                if(this.isDead) return;

                // Severe wound tracking
                if(this.hasBuff('Severe wound')) {
                    this.damageTakenDuringSevereWound += damage;
                }

                // Shield
                if(this.shield > 0) {
                    if(this.shield >= damage) {
                        this.shield -= damage;
                        damage = 0;
                    } else {
                        damage -= this.shield;
                        this.shield = 0;
                    }
                }

                this.hp -= damage;
                BattleEngine.showFloatingText(this.domElement, `-${Math.floor(damage).toLocaleString()}${isCrit?'!':''}`, isCrit ? "#ff4b4b" : "#f5a623");
                this.domElement.classList.add('hurt-anim');
                setTimeout(() => this.domElement.classList.remove('hurt-anim'), 300);

                if(this.hp <= 0) {
                    this.hp = 0;
                    this.die(source);
                } else {
                    // Goku passive 3 check
                    if(this.id === 'goku' && this.hp < this.maxHp * 0.5 && !this.gokuHealed) {
                        this.gokuHealed = true;
                        this.heal(this.maxHp * 0.5);
                        BattleEngine.log(`${this.name} tự hồi phục 50% HP (Nội tại)!`, this.team);
                    }
                }
                this.updateStatsDisplay();
            }

            heal(amount) {
                if(this.isDead) return;
                if(this.id !== 'cooler' && this.hasBuff('Anti-heal')) return;
                
                amount *= (1 + this.healBonus);
                amount *= BattleEngine.globalHealMult;

                this.hp = Math.min(this.maxHp, this.hp + amount);
                BattleEngine.showFloatingText(this.domElement, `+${Math.floor(amount).toLocaleString()}`, "#50e3c2");
                this.updateStatsDisplay();
            }

            gainShield(amount) {
                if(this.isDead) return;
                amount *= BattleEngine.globalShieldMult;
                this.shield += amount;
                this.updateStatsDisplay();
            }

            gainEn(amount) {
                if(this.isDead) return;
                this.en = Math.min(this.maxEn, this.en + amount);
                this.updateStatsDisplay();
            }

            die(killer) {
                this.isDead = true;
                this.domElement.classList.add('dead');
                BattleEngine.log(`${this.name} đã bị hạ gục!`, this.team);
                this.hp = 0;
                this.updateStatsDisplay();

                // Broly Dũng Cảm flag handling
                if(killer && killer.id === 'broly') {
                    this.passiveDisabled = true; // Cannot revive
                }
                if(this.hasBuff('Severe wound') && killer && killer.id === 'jiren') {
                    this.passiveDisabled = true;
                }

                // Global event: Any hero dies -> Broly heals
                let allBrolys = BattleEngine.getAllAlive().filter(h => h.id === 'broly');
                allBrolys.forEach(b => {
                    b.heal(b.maxHp * 0.12);
                    b.addBuff(new Buff('Dũng cảm', 'buff', 99, {}));
                    BattleEngine.log(`${b.name} hồi máu và nhận Dũng Cảm nhờ nội tại!`, b.team);
                });
            }

            onTurnStart() {
                if(this.isDead) return;
                
                // Decrease buff durations
                this.buffs.forEach(b => b.duration--);
                
                // Bleeding Zamasu
                let bleeding = this.buffs.find(b => b.name === 'Bleeding');
                if(bleeding) {
                    let dmg = bleeding.effectData.dmg;
                    if(BattleEngine.getAllAlive().some(h => h.id === 'zamasu' && h.team !== this.team)) {
                        dmg *= 1.2; // Zamasu God Skill 1
                    }
                    BattleEngine.log(`${this.name} chịu ${Math.floor(dmg)} ST từ Chảy Máu.`, this.team);
                    this.receiveDirectDamage(dmg, null);
                }

                // Severe Wound Explode
                let severe = this.buffs.find(b => b.name === 'Severe wound' && b.duration <= 0);
                if(severe) {
                    let mult = 0.2 + 0.2; // base + god skill
                    let popDmg = this.damageTakenDuringSevereWound * mult;
                    BattleEngine.log(`Vết thương sâu của ${this.name} bùng nổ gây ${Math.floor(popDmg)} ST!`, this.team);
                    this.receiveDirectDamage(popDmg, null);
                    this.damageTakenDuringSevereWound = 0;
                }

                // Clean expired buffs
                this.buffs = this.buffs.filter(b => b.duration > 0);

                if(this.isDead) return;

                // Cooler Passive 1
                if(this.id === 'cooler' && this.hasDebuff()) {
                    this.heal(this.atk * 1.8);
                    BattleEngine.log(`${this.name} hồi máu nhờ có debuff!`, this.team);
                }

                // Broly Passive 2
                if(this.id === 'broly') {
                    if(this.hp > this.maxHp * 0.8) this.gainEn(2);
                    this.brolyEnTurnCount++;
                    if(this.brolyEnTurnCount % 2 === 0 && this.brolyDmgStacks < 3) {
                        this.brolyDmgStacks++;
                        this.bonusDmg += 0.25;
                    }
                }

                // Zamasu Stun cooldown
                if(this.zamasuStunCooldown > 0) this.zamasuStunCooldown--;

                this.updateStatsDisplay();
            }
        }

        // ==========================================
        // BATTLE ENGINE
        // ==========================================
        const BattleEngine = {
            team1: [],
            team2: [],
            turnQueue: [],
            currentTurnIndex: 0,
            globalAtkMult: 1,
            globalShieldMult: 1,
            globalHealMult: 1,

            init(t1Ids, t2Ids) {
                this.team1 = t1Ids.map((id, i) => new Hero(HERO_DB.find(h=>h.id===id), 1, i));
                this.team2 = t2Ids.map((id, i) => new Hero(HERO_DB.find(h=>h.id===id), 2, i));
                
                this.renderArena();
                this.triggerStartEvent();
            },

            renderArena() {
                const buildDOM = (hero) => {
                    let el = document.createElement('div');
                    el.className = 'entity';
                    el.id = hero.uid;
                    el.innerHTML = `
                        <div class="e-avatar">${hero.avatar}</div>
                        <div class="e-name">${hero.name}</div>
                        <div class="bar-container"><div class="hp-bar" style="width:100%"></div></div>
                        <div class="bar-container"><div class="en-bar" style="width:0%"></div></div>
                        <div class="hp-text"></div>
                        <div class="status-icons"></div>
                    `;
                    hero.domElement = el;
                    hero.updateStatsDisplay();
                    return el;
                };

                const t1 = document.getElementById('team1-side');
                const t2 = document.getElementById('team2-side');
                t1.innerHTML = ''; t2.innerHTML = '';

                this.team1.forEach(h => t1.appendChild(buildDOM(h)));
                this.team2.forEach(h => t2.appendChild(buildDOM(h)));
            },

            triggerStartEvent() {
                const events = [
                    { name: "Hoả Lực", desc: "+30% ATK toàn sân", action: () => { this.globalAtkMult = 1.3; } },
                    { name: "Lá Chắn", desc: "Tăng 80% tạo Khiên", action: () => { this.globalShieldMult = 1.8; } },
                    { name: "Liên Hoàn", desc: "Tăng 40% hồi phục", action: () => { this.globalHealMult = 1.4; } },
                    { name: "Trâu Bò", desc: "+30% Max HP toàn sân", action: () => { 
                        [...this.team1, ...this.team2].forEach(h => { h.maxHp*=1.3; h.hp*=1.3; h.updateStatsDisplay(); });
                    }}
                ];
                let ev = events[Math.floor(Math.random() * events.length)];
                
                let popup = document.createElement('div');
                popup.className = 'popup-event';
                popup.innerHTML = `<h2>Sự Kiện Đầu Trận</h2><br><h3>${ev.name}</h3><p>${ev.desc}</p>`;
                document.body.appendChild(popup);
                ev.action();

                // Broly start passive 1
                [...this.team1, ...this.team2].forEach(h => {
                    if(h.id === 'broly') h.bonusDmg += 0.65;
                });

                // Đầu trận random 1 đội đánh trước (buff 1000 spd cho hero nhanh nhất đội đó)
                let firstTeam = Math.random() < 0.5 ? this.team1 : this.team2;
                let fastest = firstTeam.reduce((max, h) => h.spd > max.spd ? h : max, firstTeam[0]);
                fastest.spd += 1000;

                setTimeout(() => {
                    popup.remove();
                    this.calculateQueue();
                    this.nextTurn();
                }, 3000);
            },

            calculateQueue() {
                this.turnQueue = [...this.team1, ...this.team2].filter(h => !h.isDead).sort((a,b) => b.spd - a.spd);
                this.currentTurnIndex = -1;
            },

            getAllAlive() { return [...this.team1, ...this.team2].filter(h => !h.isDead); },
            getAliveHeroes(team) { return (team===1 ? this.team1 : this.team2).filter(h => !h.isDead); },
            getEnemies(myTeam) { return this.getAliveHeroes(myTeam === 1 ? 2 : 1); },
            getAllies(myTeam) { return this.getAliveHeroes(myTeam); },

            log(msg, team) {
                const logEl = document.getElementById('combat-log');
                const tClass = team === 1 ? 'log-t1' : (team === 2 ? 'log-t2' : '');
                logEl.innerHTML += `<div class="log-entry"><span class="${tClass}">[Đội ${team}]</span> ${msg}</div>`;
                logEl.scrollTop = logEl.scrollHeight;
            },

            showFloatingText(element, text, color) {
                let ft = document.createElement('div');
                ft.className = 'floating-text';
                ft.style.color = color;
                ft.innerText = text;
                ft.style.top = '20px';
                ft.style.left = '40px';
                element.appendChild(ft);
                setTimeout(() => ft.remove(), 1000);
            },

            nextTurn() {
                // Check win condition
                if(this.getAliveHeroes(1).length === 0) return alert("ĐỘI 2 CHIẾN THẮNG!");
                if(this.getAliveHeroes(2).length === 0) return alert("ĐỘI 1 CHIẾN THẮNG!");

                document.querySelectorAll('.entity').forEach(e => e.classList.remove('active-turn'));

                this.currentTurnIndex++;
                if(this.currentTurnIndex >= this.turnQueue.length) {
                    this.calculateQueue();
                    this.currentTurnIndex = 0;
                }

                let currentHero = this.turnQueue[this.currentTurnIndex];
                if(currentHero.isDead) return this.nextTurn();

                currentHero.domElement.classList.add('active-turn');
                document.getElementById('turn-indicator').innerText = `Lượt của: ${currentHero.name}`;
                document.getElementById('turn-indicator').style.color = currentHero.team === 1 ? 'var(--primary)' : 'var(--danger)';

                currentHero.onTurnStart();
                if(currentHero.isDead) return this.nextTurn(); // Died from poison/bleed

                // Check Stun
                if(currentHero.hasBuff('Choáng')) {
                    this.log(`${currentHero.name} bị choáng, mất lượt!`, currentHero.team);
                    setTimeout(() => this.nextTurn(), 1000);
                    return;
                }

                this.updateUIForTurn(currentHero);
            },

            updateUIForTurn(hero) {
                const btnN = document.getElementById('btn-normal');
                const btnA = document.getElementById('btn-active');
                
                // Normal descriptions
                let nDesc = "Gây ST lên 1 mục tiêu";
                if(hero.id === 'zamasu') nDesc = "Gây ST toàn đội địch, tạo Chảy Máu";
                if(hero.id === 'jiren') nDesc = "Ưu tiên hàng sau, tạo Vết Thương Sâu";
                document.getElementById('desc-normal').innerText = `${nDesc} (Hồi EN)`;

                // Active descriptions
                let aDesc = "Kỹ năng mạnh";
                if(hero.id === 'jiren') aDesc = `Cần ${hero.maxEn} EN. Gây 275% ATK, tăng Bạo Kích`;
                if(hero.id === 'goku') aDesc = `Cần ${hero.maxEn} EN. ST toàn đội, giảm ST địch, Bảo Vệ đồng minh`;
                if(hero.id === 'cooler') aDesc = `Cần ${hero.maxEn} EN. 320% ATK, 40% Choáng, Xóa Buff`;
                if(hero.id === 'broly') aDesc = `Cần ${hero.maxEn} EN. 275% ATK, Tăng Bạo Kích, Cấm hồi sinh`;
                if(hero.id === 'zamasu') aDesc = `Cần ${hero.maxEn} EN. 110% ATK toàn đội, 30% Tạo Hoảng Sợ`;
                document.getElementById('desc-active').innerText = aDesc;

                btnA.disabled = hero.en < hero.maxEn;
            },

            getTarget(hero, preferBack = false) {
                let enemies = this.getEnemies(hero.team);
                if(enemies.length === 0) return null;
                if(preferBack) {
                    // Try to get index 1 or 2 (back row)
                    let back = enemies.filter(e => e.index > 0);
                    if(back.length > 0) return back[Math.floor(Math.random() * back.length)];
                }
                // Front row or random
                return enemies[Math.floor(Math.random() * enemies.length)];
            },

            playAttackAnim(hero) {
                hero.domElement.classList.add('attack-anim');
                setTimeout(() => hero.domElement.classList.remove('attack-anim'), 600);
            },

            castNormal() {
                let hero = this.turnQueue[this.currentTurnIndex];
                this.playAttackAnim(hero);
                let atkVal = hero.atk * this.globalAtkMult;

                if(hero.id === 'jiren') {
                    let target = this.getTarget(hero, true);
                    hero.gainEn(1.8);
                    this.log(`${hero.name} đánh thường vào ${target.name}`, hero.team);
                    target.takeDamage(hero, atkVal * 0.98);
                    target.addBuff(new Buff('Severe wound', 'debuff', 2, {}));
                } 
                else if(hero.id === 'goku') {
                    let target = this.getTarget(hero);
                    hero.gainEn(0.9);
                    this.log(`${hero.name} đánh thường vào ${target.name}`, hero.team);
                    target.takeDamage(hero, atkVal * 1.0);
                }
                else if(hero.id === 'cooler') {
                    let target = this.getTarget(hero);
                    hero.gainEn(1.2);
                    this.log(`${hero.name} đánh thường vào ${target.name}`, hero.team);
                    target.takeDamage(hero, atkVal * 0.99);
                }
                else if(hero.id === 'broly') {
                    let target = this.getTarget(hero);
                    hero.gainEn(1.0);
                    // God skill 1 first hit shield
                    if(!hero.hasBuff('FirstHit')) {
                        hero.addBuff(new Buff('FirstHit', 'mark', 99, {}));
                        hero.gainShield(hero.maxHp * 0.1);
                    }
                    this.log(`${hero.name} đánh thường vào ${target.name}`, hero.team);
                    target.takeDamage(hero, atkVal * 1.0);
                }
                else if(hero.id === 'zamasu') {
                    let enemies = this.getEnemies(hero.team);
                    hero.gainEn(1.3);
                    this.log(`${hero.name} đánh thường diện rộng!`, hero.team);
                    enemies.forEach(t => {
                        t.takeDamage(hero, atkVal * 0.88);
                        t.addBuff(new Buff('Bleeding', 'debuff', 2, { dmg: atkVal * 0.1 }));
                        
                        // Passive 2: 80% Stun (CD 4)
                        if(hero.zamasuStunCooldown === 0 && Math.random() < 0.8) {
                            t.addBuff(new Buff('Choáng', 'debuff', 1, {}));
                            hero.zamasuStunCooldown = 4;
                            this.log(`${t.name} bị Choáng bởi Đánh Trúng!`, t.team);
                        }
                    });
                }

                setTimeout(() => this.nextTurn(), 1000);
            },

            castActive() {
                let hero = this.turnQueue[this.currentTurnIndex];
                if(hero.en < hero.maxEn) return;
                hero.en = 0; // Consume all maxEn for this game design
                hero.updateStatsDisplay();
                this.playAttackAnim(hero);
                let atkVal = hero.atk * this.globalAtkMult;

                if(hero.id === 'jiren') {
                    let target = this.getTarget(hero, true);
                    this.log(`${hero.name} dùng Tuyệt Kỹ vào ${target.name}!`, hero.team);
                    target.takeDamage(hero, atkVal * 2.75, true);
                    if(hero.jirenCritStacks < 3) {
                        hero.jirenCritStacks++;
                        hero.critRate += 0.15;
                    }
                }
                else if(hero.id === 'goku') {
                    let enemies = this.getEnemies(hero.team);
                    this.log(`${hero.name} dùng Tuyệt Kỹ lên toàn sân!`, hero.team);
                    enemies.forEach(t => {
                        t.takeDamage(hero, atkVal * 0.55, true);
                        t.addBuff(new Buff('GokuDebuff', 'debuff', 3, {}));
                    });
                    
                    // God Skill 1
                    hero.heal(hero.maxHp * 0.04);
                    
                    // Passive 1
                    if(hero.hp > hero.maxHp * 0.5) {
                        let allies = this.getAllies(hero.team).filter(a => a.id !== 'goku');
                        if(allies.length > 0) {
                            let lowest = allies.reduce((min, a) => a.hp < min.hp ? a : min, allies[0]);
                            lowest.addBuff(new Buff('Bảo vệ', 'buff', 1, {}));
                            this.log(`${hero.name} tạo Bảo Vệ cho ${lowest.name}`, hero.team);
                        }
                    }
                }
                else if(hero.id === 'cooler') {
                    let target = this.getTarget(hero, true);
                    this.log(`${hero.name} dùng Tuyệt Kỹ vào ${target.name}!`, hero.team);
                    let dmg = atkVal * 3.20; // 275 + 45
                    dmg *= 1.10; // God skill 2
                    target.takeDamage(hero, dmg, true);
                    if(Math.random() < 0.4) target.addBuff(new Buff('Choáng', 'debuff', 1, {}));
                    
                    // God skill 1 Phân tán
                    if(Math.random() < 0.6) {
                        target.clearBuffsByType('buff');
                        this.log(`${target.name} bị xóa toàn bộ Buff tốt!`, target.team);
                    }
                }
                else if(hero.id === 'broly') {
                    let target = this.getTarget(hero);
                    this.log(`${hero.name} dùng Tuyệt Kỹ vào ${target.name}!`, hero.team);
                    if(!hero.hasBuff('FirstHit')) {
                        hero.addBuff(new Buff('FirstHit', 'mark', 99, {}));
                        hero.gainShield(hero.maxHp * 0.1);
                    }
                    if(!hero.hasBuff('BrolyCrit')) {
                        hero.critRate += 0.30;
                        hero.addBuff(new Buff('BrolyCrit', 'mark', 99, {}));
                    }
                    target.takeDamage(hero, atkVal * 2.75, true);
                }
                else if(hero.id === 'zamasu') {
                    let enemies = this.getEnemies(hero.team);
                    this.log(`${hero.name} dùng Tuyệt Kỹ diện rộng!`, hero.team);
                    enemies.forEach(t => {
                        t.takeDamage(hero, atkVal * 1.10, true);
                        if(Math.random() < 0.3) {
                            t.addBuff(new Buff('Terror', 'debuff', 2, {}));
                            if(Math.random() < 0.5) t.addBuff(new Buff('Choáng', 'debuff', 2, {}));
                        }
                        // Passive 1 logic (Terror stat drop) happens inherently in damage calculation
                    });
                }

                setTimeout(() => this.nextTurn(), 1000);
            }
        };


        // ==========================================
        // APP CONTROLLER (UI & PHASES)
        // ==========================================
        const GameApp = {
            t1Bans: [], t2Bans: [],
            t1Picks: [], t2Picks: [],
            currentPhase: 1, // 1: T1 Ban, 2: T2 Ban, 3: T1 Pick 1.. 
            timerInt: null,
            time: 25,
            
            showScreen(id) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
            },

            startBanPhase() {
                this.showScreen('bp-screen');
                this.currentPhase = 1;
                this.renderPool();
                this.startTimer(25, this.autoAction.bind(this));
            },

            renderPool() {
                const pool = document.getElementById('bp-pool');
                pool.innerHTML = '';
                
                let title = "";
                if(this.currentPhase === 1) title = "CẤM TƯỚNG - ĐỘI 1 (Chọn 1)";
                else if(this.currentPhase === 2) title = "CẤM TƯỚNG - ĐỘI 2 (Chọn 1)";
                else if(this.currentPhase % 2 !== 0) title = `CHỌN TƯỚNG - ĐỘI 1 (${this.t1Picks.length}/3)`;
                else title = `CHỌN TƯỚNG - ĐỘI 2 (${this.t2Picks.length}/3)`;
                
                document.getElementById('bp-title').innerText = title;
                
                // Nút "Bỏ qua cấm" chỉ hiện ở phase 1,2
                document.getElementById('bp-skip-btn').style.display = this.currentPhase <= 2 ? 'inline-block' : 'none';
                document.getElementById('bp-action-btn').innerText = this.currentPhase <= 2 ? "Xác Nhận Cấm" : "Xác Nhận Chọn";

                HERO_DB.forEach(h => {
                    let card = document.createElement('div');
                    card.className = 'hero-card';
                    card.innerHTML = `
                        <div class="hero-avatar">${h.avatar}</div>
                        <div class="hero-name">${h.name}</div>
                        <div class="hero-role">${h.role}</div>
                    `;
                    
                    if(this.t1Bans.includes(h.id) || this.t2Bans.includes(h.id)) card.classList.add('banned');
                    
                    card.onclick = () => {
                        if(card.classList.contains('banned')) return;
                        document.querySelectorAll('.hero-card').forEach(c => { c.classList.remove('selected-t1', 'selected-t2'); });
                        card.classList.add(this.currentPhase % 2 !== 0 ? 'selected-t1' : 'selected-t2');
                        card.dataset.id = h.id;
                    };
                    pool.appendChild(card);
                });

                document.getElementById('t1-picks').innerText = this.t1Picks.map(id => HERO_DB.find(h=>h.id===id).name).join(', ');
                document.getElementById('t2-picks').innerText = this.t2Picks.map(id => HERO_DB.find(h=>h.id===id).name).join(', ');
            },

            startTimer(seconds, callback) {
                clearInterval(this.timerInt);
                this.time = seconds;
                document.getElementById('bp-timer').innerText = this.time;
                this.timerInt = setInterval(() => {
                    this.time--;
                    document.getElementById('bp-timer').innerText = this.time;
                    if(this.time <= 0) {
                        clearInterval(this.timerInt);
                        callback();
                    }
                }, 1000);
            },

            skipBPPhase() {
                if(this.currentPhase === 1) { this.currentPhase = 2; this.renderPool(); this.startTimer(25, this.autoAction.bind(this)); }
                else if(this.currentPhase === 2) { this.currentPhase = 3; this.renderPool(); this.startTimer(30, this.autoAction.bind(this)); }
            },

            confirmBPAction() {
                let selected = document.querySelector('.hero-card.selected-t1, .hero-card.selected-t2');
                if(!selected && this.currentPhase > 2) return alert("Vui lòng chọn 1 tướng!");
                let id = selected ? selected.dataset.id : null;

                if(this.currentPhase === 1) { if(id) this.t1Bans.push(id); this.currentPhase = 2; this.startTimer(25, this.autoAction.bind(this)); }
                else if(this.currentPhase === 2) { if(id) this.t2Bans.push(id); this.currentPhase = 3; this.startTimer(30, this.autoAction.bind(this)); }
                else if(this.currentPhase > 2) {
                    if(this.currentPhase % 2 !== 0) this.t1Picks.push(id);
                    else this.t2Picks.push(id);
                    
                    this.currentPhase++;
                    if(this.t1Picks.length === 3 && this.t2Picks.length === 3) {
                        clearInterval(this.timerInt);
                        this.startBattle();
                        return;
                    }
                    this.startTimer(30, this.autoAction.bind(this));
                }
                this.renderPool();
            },

            autoAction() {
                let avail = HERO_DB.filter(h => !this.t1Bans.includes(h.id) && !this.t2Bans.includes(h.id)).map(h=>h.id);
                if(this.currentPhase <= 2) {
                    // Random ban or skip
                    this.confirmBPAction(); 
                } else {
                    // Random pick
                    let cards = document.querySelectorAll('.hero-card:not(.banned)');
                    if(cards.length > 0) cards[0].classList.add(this.currentPhase % 2 !== 0 ? 'selected-t1' : 'selected-t2');
                    this.confirmBPAction();
                }
            },

            startBattle() {
                this.showScreen('battle-screen');
                // Fill if missed
                while(this.t1Picks.length < 3) this.t1Picks.push(HERO_DB[Math.floor(Math.random()*HERO_DB.length)].id);
                while(this.t2Picks.length < 3) this.t2Picks.push(HERO_DB[Math.floor(Math.random()*HERO_DB.length)].id);
                
                BattleEngine.init(this.t1Picks, this.t2Picks);
            }
        };
    </script>
